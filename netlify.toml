[build]
  command = "npm run build"
  publish = "dist"

# Values live in the Netlify dashboard. This file may name variables but must
# not contain secrets, JWTs, or API keys.
[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  VITE_KATALIST_DEMO_MODE = "false"
  VITE_KATALIST_ENV = "uat"
  KATALIST_ENV = "uat"
  VITE_MAGIC_BOX_ATTACHMENTS_ENABLED = "false"
  MAGIC_BOX_ATTACHMENTS_ENABLED = "false"
  VITE_LIST_COLLABORATION_ENABLED = "false"
  LIST_COLLABORATION_ENABLED = "false"
