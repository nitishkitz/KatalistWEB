name: quality

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:app

  # T00: isolated synthetic preview coverage (tests/e2e/preview/). Demo
  # persona actions write only preview-local state; fixture Supabase settings
  # must never resolve to a real backend. The "staging" project is not registered here (no
  # KATALIST_STAGING_BASE_URL/KATALIST_TEST_ACCOUNT_* configured), so this
  # job only ever exercises preview-*.
  e2e-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Authenticated preview specs require the Demo tab. Without this flag
      # those specs skip and a green workflow would not exercise them.
      - run: npx playwright test
        env:
          KATALIST_E2E_PORT: "4173"
          VITE_KATALIST_DEMO_MODE: "true"
          VITE_SUPABASE_URL: "https://ci-fixture.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "ci-fixture-anon-key"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
